name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  # Restores packages and runs build and test code – only with read access to the repository. Write access and
  # the OIDC token for the attestation are only available in the release job, which runs no third-party code.
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      asset: ${{ steps.publish.outputs.asset }}
    steps:
      # Actions are pinned to commit SHAs (tags can be moved); Dependabot keeps them up to date.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/PamRdpProxyManager.Core.Tests/PamRdpProxyManager.Core.Tests.csproj -c Release

      - name: Publish portable EXE
        id: publish
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          dotnet publish src/PamRdpProxyManager/PamRdpProxyManager.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:Version=$version -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $name = "PamRdpProxyManager-$($env:GITHUB_REF_NAME)-win-x64.exe"
          Move-Item publish/PamRdpProxyManager.exe $name
          "asset=$name" | Out-File -Encoding utf8 -Append $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-exe
          path: ${{ steps.publish.outputs.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      # Build provenance attestation (verifiable with `gh attestation verify`)
      id-token: write
      attestations: write
    env:
      ASSET: ${{ needs.build.outputs.asset }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-exe

      - name: Checksum
        shell: pwsh
        run: |
          $name = $env:ASSET
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
          # Format compatible with `sha256sum -c`
          "$hash  $name" | Out-File -Encoding ascii -NoNewline "$name.sha256"
          "## SHA256`n`n``$hash  $name``" | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ env.ASSET }}

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $hash = (Get-Content "$env:ASSET.sha256").Split(' ')[0]
          $notes = "Portable EXE – keine Installation und keine Adminrechte nötig.`n`nSHA256 (``$env:ASSET``):`n``````n$hash`n```````n`nHerkunft prüfen (von GitHub Actions aus diesem Repository gebaut):`n``````n" +
            "gh attestation verify $env:ASSET --repo $env:GITHUB_REPOSITORY`n``````"
          $prerelease = if ($env:GITHUB_REF_NAME.Contains('-')) { '--prerelease' } else { $null }

          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $env:ASSET "$env:ASSET.sha256" --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $env:ASSET "$env:ASSET.sha256" `
              --title $env:GITHUB_REF_NAME --notes $notes --generate-notes $prerelease
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
