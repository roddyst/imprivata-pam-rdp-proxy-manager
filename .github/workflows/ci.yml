name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Actions are pinned to commit SHAs (tags can be moved); Dependabot keeps them up to date.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/PamRdpProxyManager.Core.Tests/PamRdpProxyManager.Core.Tests.csproj -c Release

      - name: Publish portable EXE
        run: >
          dotnet publish src/PamRdpProxyManager/PamRdpProxyManager.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o publish

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PamRdpProxyManager-win-x64
          path: publish/PamRdpProxyManager.exe
          if-no-files-found: error
