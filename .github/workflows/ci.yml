name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Actions are pinned to commit SHAs (tags can be moved); Dependabot keeps them up to date.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/PamRdpProxyManager.Core.Tests/PamRdpProxyManager.Core.Tests.csproj -c Release

      - name: Publish portable EXE
        run: >
          dotnet publish src/PamRdpProxyManager/PamRdpProxyManager.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o publish

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PamRdpProxyManager-win-x64
          path: publish/PamRdpProxyManager.exe
          if-no-files-found: error
